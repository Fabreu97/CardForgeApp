name: cardforge
description: App to monitor and manage the CardForge automatic Magic card sorter.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  http: ^1.2.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
